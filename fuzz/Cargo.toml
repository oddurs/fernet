[package]
name = "fernet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fernet-fs-path = { path = "../crates/fernet-path" }

# Kept out of the main workspace: it needs nightly and its own lockfile.
[workspace]

[[bin]]
name = "path_parse"
path = "fuzz_targets/path_parse.rs"
test = false
doc = false
bench = false
