[package]
name = "fernet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "fernet_fuzz"
path = "src/lib.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fernet-fs-path = { path = "../crates/fernet-path" }
fernet-fs-formats = { path = "../crates/fernet-formats" }
fernet-fs-store = { path = "../crates/fernet-store" }
serde_json = "1"

# Kept out of the main workspace: it needs nightly and its own lockfile.
[workspace]

[[bin]]
name = "path_parse"
path = "fuzz_targets/path_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toml_parse"
path = "fuzz_targets/toml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_parse"
path = "fuzz_targets/yaml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment_scan"
path = "fuzz_targets/segment_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_parse"
path = "fuzz_targets/markdown_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_parse"
path = "fuzz_targets/csv_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sqlite_parse"
path = "fuzz_targets/sqlite_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_parse"
path = "fuzz_targets/zip_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar_parse"
path = "fuzz_targets/tar_parse.rs"
test = false
doc = false
bench = false
