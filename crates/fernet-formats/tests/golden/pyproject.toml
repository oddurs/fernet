[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spam"
version = "1.2.3"
dependencies = ["httpx>=0.27", "rich"]
optional-dependencies.dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
nested = [[1, 2], [3, 4], []]
mixed = [{ a = 1 }, { b = [true, false] }]
