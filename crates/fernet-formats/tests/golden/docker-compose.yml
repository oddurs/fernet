# Compose file with anchors and merge keys.
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *defaults
    image: api:2.4.1
    ports:
      - "8080:8080"
      - 9090:9090
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/app
      LOG_LEVEL: info
      WORKERS: 4
      DEBUG: false
      EMPTY:
    depends_on: [db, cache]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
  db:
    <<: *defaults
    image: 'postgres:16'
    volumes:
      - db-data:/var/lib/postgresql/data
  cache:
    image: redis:7-alpine
    command: >
      redis-server
      --save 60 1
      --loglevel warning

volumes:
  db-data: {}
