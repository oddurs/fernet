[package]
name = "fernet-fs-fuse"
description = "FUSE adapter for fernet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not `workspace = true`: this crate may contain `unsafe` (each use carries a
# `// SAFETY:` comment and a DECISIONS.md entry), so `unsafe_code` is `deny`,
# not `forbid`. Everything else mirrors [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
fernet-fs-core.workspace = true
fernet-fs-formats.workspace = true
fuser = "0.18"
# Already in the tree through fuser; for utimensat without following symlinks.
nix = { version = "0.31", default-features = false, features = ["fs"] }
fernet-fs-store.workspace = true
fernet-fs-path.workspace = true
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tracing = "0.1"
