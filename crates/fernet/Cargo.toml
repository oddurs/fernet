[package]
name = "fernet-fs"
description = "fernet: every file has depth, every moment is kept."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["mount"]
# The FUSE mount. Needs libfuse on macOS (macFUSE or FUSE-T) to build;
# `--no-default-features` builds everything else without it.
mount = ["dep:fernet-fs-fuse", "dep:ctrlc"]

[[bin]]
name = "fernet"
path = "src/main.rs"

[dependencies]
fernet-fs-core.workspace = true
fernet-fs-path.workspace = true
fernet-fs-store.workspace = true
fernet-fs-fuse = { workspace = true, optional = true }
anyhow = "1"
ctrlc = { version = "3", features = ["termination"], optional = true }
jiff = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
similar = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
fernet-fs-core.workspace = true
fernet-fs-store.workspace = true
assert_cmd = "2"
predicates = "3"
tempfile = "3"
